[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line-too-long (handled by the formatter)
]

[tool.ruff.format]
# Defaults are black-compatible.

[tool.mypy]
python_version = "3.12"
files = ["."]
strict = true

[[tool.mypy.overrides]]
module = ["pyvisa"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line-too-long (handled by the formatter)
    "B904",    # raise-without-from (would need extensive refactoring)
    "SIM105",  # use-contextlib-suppress (common pattern in codebase)
    "RUF046",  # unnecessary int() cast (check existing logic first)
    "RUF005",  # iterable unpacking (list concatenation in DEEP_FREQS_MHZ is clear)
    "RUF002",  # docstring ambiguous unicode (MINUS SIGN in comment is intentional)
]

[tool.ruff.format]
# Defaults are black-compatible.

[tool.mypy]
python_version = "3.12"
files = ["."]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["pyvisa", "pyvisa.*"]
ignore_missing_imports = true
